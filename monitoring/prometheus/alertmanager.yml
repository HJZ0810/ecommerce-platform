global:
  resolve_timeout: 5m
  slack_api_url: ''

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  routes:
  - match:
      severity: critical
    receiver: 'critical'
  - match:
      severity: warning
    receiver: 'warning'

receivers:
  - name: 'default'
    slack_configs:
    - channel: '#alerts'
      send_resolved: true
  - name: 'critical'
    slack_configs:
    - channel: '#critical-alerts'
      send_resolved: true
  - name: 'warning'
    slack_configs:
    - channel: '#warnings'
      send_resolved: true
