# GitHub Actions CI/CD Pipeline
# 电商平台完整 CI/CD 配置
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 允许手动触发 / Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment / 部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================
  # Job 1: Lint and Type Check
  # ========================================
  lint:
    name: Lint & Type Check / 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code / 检出代码
        uses: actions/checkout@v4

      - name: Setup Node.js / 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies / 安装依赖
        run: npm ci

      - name: Run ESLint / 运行代码检查
        run: npm run lint --workspaces

      - name: TypeScript type check / TypeScript 类型检查
        run: npm run typecheck --workspace=backend

  # ========================================
  # Job 2: Unit Tests
  # ========================================
  test:
    name: Unit Tests / 单元测试
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code / 检出代码
        uses: actions/checkout@v4

      - name: Setup Node.js / 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies / 安装依赖
        run: npm ci

      - name: Run backend tests / 运行后端测试
        run: npm run test --workspace=backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          JWT_REFRESH_SECRET: test-refresh-secret-key

      - name: Run frontend tests / 运行前端测试
        run: npm run test --workspace=frontend
        env:
          NODE_ENV: test

      - name: Upload coverage reports / 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: backend-coverage

  # ========================================
  # Job 3: Build & Push Docker Image
  # ========================================
  build:
    name: Build & Push / 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code / 检出代码
        uses: actions/checkout@v4

      - name: Set up Docker Buildx / 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry / 登录容器注册表
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata / 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image / 构建并推送 Docker 镜像
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ========================================
  # Job 4: Security Scan
  # ========================================
  security:
    name: Security Scan / 安全扫描
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Trivy vulnerability scanner / 运行 Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security / 上传 Trivy 结果
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan dependencies / 扫描依赖
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ========================================
  # Job 5: Deploy to Staging / 部署到测试环境
  # ========================================
  deploy-staging:
    name: Deploy to Staging / 部署到测试环境
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - name: Checkout code / 检出代码
        uses: actions/checkout@v4

      - name: Configure kubectl / 配置 kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to Kubernetes / 部署到 Kubernetes
        run: |
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/ecommerce-backend -n staging --timeout=300s
          kubectl rollout status deployment/ecommerce-frontend -n staging --timeout=300s

      - name: Run smoke tests / 运行冒烟测试
        run: |
          curl -f https://staging.example.com/health || exit 1
          curl -f https://staging.example.com/api/v1/health || exit 1

  # ========================================
  # Job 6: Deploy to Production / 部署到生产环境
  # ========================================
  deploy-production:
    name: Deploy to Production / 部署到生产环境
    runs-on: ubuntu-latest
    needs: [build, security, deploy-staging]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Checkout code / 检出代码
        uses: actions/checkout@v4

      - name: Configure kubectl / 配置 kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to Kubernetes / 部署到 Kubernetes
        run: |
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/ecommerce-backend -n production --timeout=600s
          kubectl rollout status deployment/ecommerce-frontend -n production --timeout=600s

      - name: Run smoke tests / 运行冒烟测试
        run: |
          curl -f https://example.com/health || exit 1
          curl -f https://example.com/api/v1/health || exit 1

      - name: Notify deployment success / 通知部署成功
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment completed successfully!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
